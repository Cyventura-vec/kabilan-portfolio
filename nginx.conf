worker_processes 1;
error_log /tmp/nginx_error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx_access.log;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    types_hash_max_size    4096;
    types_hash_bucket_size 128;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    sendfile          on;
    keepalive_timeout 65;

    include /home/zagot/kabilan-portfolio/nginx/conf.d/optionsbleed.conf;

    server {
        listen      8085;
        server_name localhost;

        root  /home/zagot/kabilan-portfolio;
        index index.html;

        include /home/zagot/kabilan-portfolio/nginx/conf.d/security_headers.conf;

        add_header X-Bleed $x_bleed_val always;

        location / {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        error_page 404 /index.html;
    }
}
