# ==============================================================================
# Security, Recon, & CORS Header Module
# Stage 1 Challenge Headers & Honest CTF Policy
# ==============================================================================

# STAGE 1: Recon Headers
add_header X-Cache "HIT" always;
add_header X-Request-ID "9f2a-112c-beef" always;

# CTF — Honest Policy Headers (not fake legal/exam authority)
add_header X-CTF-Mode "human-solve-intended" always;
add_header X-AI-Policy "ctf-reward-judgment-no-block-all-ai" always;
add_header X-CTF-Honest-Policy "this-is-a-ctf-intended-for-human-solve-dead-ends-are-intentional" always;
add_header X-Decoy-Surface "onion-format-decoy-flags-are-baited" always;
add_header X-Robots-Tag "noai, noimageai, noindex, nofollow" always;
add_header Link "</.well-known/ai.txt>; rel=\"ai-policy\", </.well-known/ai.json>; rel=\"ai-policy\"; type=\"application/json\"" always;

# Permissive CORS headers for testing / security tooling
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
add_header Access-Control-Allow-Headers "*" always;
